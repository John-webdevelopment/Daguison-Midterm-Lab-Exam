<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Lab Exam - Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container">

    <section class="card">

        <header class="header">
            <h1>Student Registration</h1>
            <p>Midterm Laboratory Exam</p>
        </header>

        <div
            id="successMessage"
            class="success"
            role="alert"
            aria-live="polite"
            hidden>
        </div>

        <form id="registrationForm" novalidate>

            <fieldset>

                <legend>Registration Information</legend>

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        aria-required="true"
                        aria-describedby="fullNameError"
                        aria-invalid="false">

                    <small
                        id="fullNameError"
                        class="error"
                        aria-live="polite">
                    </small>
                </div>


                <div class="form-group">
                    <label for="studentNumber">Student Number</label>

                    <input
                        type="text"
                        id="studentNumber"
                        name="studentNumber"
                        placeholder="24-0952-781"
                        aria-required="true"
                        aria-describedby="studentNumberError"
                        aria-invalid="false">

                    <small
                        id="studentNumberError"
                        class="error"
                        aria-live="polite">
                    </small>
                </div>


                <div class="form-group">
                    <label for="emailAddress">Email Address</label>

                    <input
                        type="email"
                        id="emailAddress"
                        name="emailAddress"
                        placeholder="student@example.com"
                        autocomplete="email"
                        aria-required="true"
                        aria-describedby="emailError"
                        aria-invalid="false">

                    <small
                        id="emailError"
                        class="error"
                        aria-live="polite">
                    </small>
                </div>


                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        aria-required="true"
                        aria-describedby="usernameError"
                        aria-invalid="false">

                    <small
                        id="usernameError"
                        class="error"
                        aria-live="polite">
                    </small>
                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        aria-required="true"
                        aria-describedby="passwordRequirements passwordError"
                        aria-invalid="false">


                    <div
                        id="passwordRequirements"
                        class="password-requirements">

                        <p>Password must contain:</p>

                        <ul>

                            <li id="lengthRule">
                                At least 8 characters
                            </li>

                            <li id="uppercaseRule">
                                At least one uppercase letter
                            </li>

                            <li id="numberRule">
                                At least one number
                            </li>

                            <li id="specialRule">
                                At least one symbol such as @, $, or !
                            </li>

                            <li id="spaceRule">
                                No spaces
                            </li>

                        </ul>

                    </div>


                    <div
                        id="passwordStrength"
                        class="strength"
                        aria-live="polite">
                    </div>

                    <small
                        id="passwordError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        aria-required="true"
                        aria-describedby="confirmPasswordError"
                        aria-invalid="false">

                    <small
                        id="confirmPasswordError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="09123456789 or +639123456789"
                        autocomplete="tel"
                        aria-required="true"
                        aria-describedby="mobileNumberError"
                        aria-invalid="false">

                    <small
                        id="mobileNumberError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="form-group">

                    <span class="field-label">
                        Gender
                    </span>

                    <div
                        class="radio-group"
                        role="radiogroup"
                        aria-labelledby="genderLabel">

                        <span id="genderLabel" class="sr-only">
                            Gender
                        </span>

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="Gender"
                                value="Male">

                            <span>Male</span>

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="Gender"
                                value="Female">

                            <span>Female</span>

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="Gender"
                                value="Prefer not to say">

                            <span>Prefer not to say</span>

                        </label>

                    </div>

                    <small
                        id="genderError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select
                        name="course"
                        id="course"
                        aria-required="true"
                        aria-describedby="courseError"
                        aria-invalid="false">

                        <option value="">
                            Select your course
                        </option>

                        <option value="BSIT">
                            BSIT
                        </option>

                        <option value="BSCS">
                            BSCS
                        </option>

                    </select>

                    <small
                        id="courseError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="form-group">

                    <label for="yearLevel">
                        Year Level
                    </label>

                    <select
                        name="yearLevel"
                        id="yearLevel"
                        aria-required="true"
                        aria-describedby="yearLevelError"
                        aria-invalid="false">

                        <option value="">
                            Select your year
                        </option>

                        <option value="1st year">
                            1st Year
                        </option>

                        <option value="2nd year">
                            2nd Year
                        </option>

                        <option value="3rd year">
                            3rd Year
                        </option>

                        <option value="4th year">
                            4th Year
                        </option>

                    </select>

                    <small
                        id="yearLevelError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="checkbox-container">

                    <label for="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            aria-required="true"
                            aria-describedby="termsError"
                            aria-invalid="false">

                        <span>
                            Terms and condition
                        </span>

                    </label>

                    <small
                        id="termsError"
                        class="error"
                        aria-live="polite">
                    </small>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        id="registerBtn">
                        Register
                    </button>

                    <button
                        type="reset"
                        id="resetBtn">
                        Reset
                    </button>

                </div>

            </fieldset>

        </form>

    </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
